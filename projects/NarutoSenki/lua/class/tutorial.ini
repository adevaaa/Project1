# ============================================================
#  AiCompat.lua  -  Alias AI untuk CharacterBase::setMon
# ============================================================
#  File ini DIBACA oleh C++ (Classes/Systems/AiCompat.hpp),
#  bukan dijalankan oleh interpreter Lua.
#
#  Aturan:
#    - Baris diawali '#'  -> nama section (mis. #Monster)
#    - Format isi         -> NamaMon = NamaAI
#    - Baris diawali '--' atau '//' -> komentar
#    - Nama sensitif huruf besar/kecil (sama dengan nama file
#      Resources/Unit/Mon/<Nama>.xml dan nama di setMon)
#
#  Artinya: setMon("Chibaku") akan memakai AI/perilaku "JibakuEX"
#  (posisi spawn, cara serang, dll). Jika Unit/Mon/Chibaku.xml
#  tidak ada, data (xml/animasi) JibakuEX dipakai juga.
#
#  Section #Characters: karakter memakai kelas AI karakter lain (Provider.hpp).
#    Madara = Ino                  -> Madara memakai AI Ino
#    Konohamaru = {Hiruzen, Skill1 = Tobi, skill2 = Kimimaro}
#                                  -> AI Hiruzen; jarak skill1 ikut Tobi,
#                                     jarak skill2 ikut Kimimaro
#    Bentuk lain yang juga didukung: tanpa kurung (Konohamaru = Hiruzen
#    lalu baris "skill1 = Tobi" di bawahnya) atau kurung berbaris-baris.
#  Kunci jarak serangan: nattack, skill1..skill5, spc1..spc3. Boleh ditulis
#  di baris sendiri (menempel ke karakter di atasnya) atau satu baris
#  dipisah koma di dalam kurung { }.
#  Karakter yang dialias sebaiknya punya data sendiri di
#  Resources/Unit/Ninja/<Nama>/; jika tidak ada, data milik AI-nya dipakai.
#
#  Section #Bullets: bullet memakai perilaku bullet lain (setBullet).
#    RinSRK = TentenSRK  -> RinSRK memakai perilaku TentenSRK. Jika
#    Unit/Projectile/RinSRK.xml tidak ada, data TentenSRK dipakai juga.
#    Penulisan "#RinSRK = TentenSRK" (dengan #) di dalam section ini juga dibaca.
#
#  Master pada #Monster / #Bullets / #Traps: "Nama = Perilaku, Master".
#    Shinteshin2 = Shintenshin,InoWar   -> hanya karakter bernama InoWar (atau clone
#                                          miliknya) yang memakai alias ini; yang lain
#                                          memakai nama apa adanya.
#    Tanpa ", Master" alias berlaku untuk semua karakter. Master juga membuat
#    pengecekan "master-nya Itachi/Shikamaru" tetap berlaku untuk mon/bullet alias itu
#    (mis. IndraSusano = ItachiSusano, Indra dianggap milik Itachi untuk efek hit-nya).
#    Pengecekan nama mon/bullet di kode (efek hit, dealloc, dll) otomatis mengikuti alias.
#
#  Tautan pada #Monster: "Nama = Perilaku, Master, Tautan".
#    Kage2 = Kage, Shikaku, KageHand2  -> Kage2 (perilaku Kage, milik Shikaku) saat
#                                         menyerang mengeluarkan KageHand2, bukan KageHand.
#    KageHand2 = KageHand              -> KageHand2 berperilaku KageHand. Master Shikaku
#                                         diwariskan dari baris Kage2.
#    Master boleh dikosongkan: "Kage2 = Kage, , KageHand2".
#
#  Section #Traps: nama trap memakai perilaku trap lain (setTrap), dan bisa dipakai
#  karakter mana pun lewat <e type="setTrap">Nama</e> di xml karakter itu.
#    Amaterasu2 = Amaterasu  -> bullet trap berperilaku Amaterasu
#    KageBom2 = KageBom      -> monster trap berperilaku KageBom
#  Perilaku bawaan yang dikenal: Amaterasu, KageBom, Kusuri. Jika
#  Unit/Projectile/Amaterasu2.xml (atau Unit/Mon/KageBom2.xml) tidak ada,
#  data aslinya dipakai.
#
#  Section #Transform: karakter bisa transform (setTransform) ke karakter lain
#  yang AI-nya berbeda.
#    Guy = Guy8Gates     -> saat setTransform, Guy diganti Guy8Gates. AI keduanya
#                           ditentukan di #Characters (mis. Guy = Itachi,
#                           Guy8Gates = Chiyo). HP, EXP, level, coin, CKR, dan gear
#                           dibawa. Kunci skill awal milik AI tujuan (mis. skill2 dan
#                           skill3 Chiyo) dipasang lagi, tidak terbuka karena transform.
#
#  Section #Load/UnloadChar: plist tambahan yang dimuat/dilepas bersama karakter
#  (perloadCharIMG / unloadCharIMG). Jenis: ninja, skill, skill2, skill3, ... (tak
#  terbatas), kuchiyose, kugutsu, guardian. Nilai '...' atau {'A', 'B'}.
#    Guy = { ninja = 'Guy8Gates', skill = 'Guy8Gates' }
#    -> memuat Unit/Ninja/Guy8Gates/Guy8Gates.plist dan Guy8Gates_Skill.plist.
#  Plist bentuk tujuan #Transform (utama + _Skill*.plist) dimuat otomatis juga.
#
#  Section daftar nama (#MainChar): karakter yang boleh masuk battle
#  (COM, musuh acak, pool acak). Nama dipisah koma, boleh berbaris-baris,
#  tanda kutip ' atau " boleh dipakai. Nama hanya masuk jika
#  Resources/Unit/Ninja/<Nama>/<Nama>.xml ada. Jika section dihapus
#  atau kosong, daftar bawaan kHeroList (UnitDefines.h) dipakai.
# ============================================================

-- ============================================================
--  AI SUMMON  (#Kugutsu / #Kuchiyose / #Ninja / #Clone)
-- ============================================================
--  Jenis unit (daftar nama, satu per baris):
--    #Kugutsu     unit Kugutsu  (Role::Kugutsu)   SasoriET = Saso   -> memakai kelas AI Saso
--    #Kuchiyose   unit Kuchiyose (Role::Summon)   Birds = Centipede -> memakai kelas AI Centipede
--    #Ninja       unit Ninja/clone (Role::Clone)  Ashura
--  Nama tanpa "= AI" (mis. Rhino) memakai AI dari #Characters (Rhino = NarakaPath); jika tidak ada,
--  dipakai AI generik LuaSummon (cari musuh, dekati, nattack, ikut owner).
--  Data unit: Resources/Unit/<Ninja|Kuchiyose|Kugutsu>/<Nama>/<Nama>.xml. Jika tidak ada, data milik
--  AI-nya dipakai. Plist unit ikut dimuat/dilepas bersama pemiliknya (tidak perlu #Load/UnloadChar).
--
--  #Clone:   Pemilik = { UnitYangDipanggil, Id = n, kunci = nilai, ... }   (boleh berbaris-baris)
--  Dipakai saat XML pemilik menjalankan <e type="setClone">N</e>. Definisi dipilih dengan:
--    1. Id sama persis dengan N (mis. Kabuto Id = 3 dan XML setClone 3), lalu
--    2. jika tidak ada, definisi ber-Id 0. N dipakai sebagai durasi untuk closing = timer.
--  Pemilik tanpa definisi tetap memakai createClone() bawaan (Kankuro, Chiyo, Naruto, dst).
--  Kunci:
--    Id = n             lihat di atas
--    closing = timer    clone mati saat durasi XML (N) habis (bawaan)
--    closing = dead     clone hidup sampai mati
--    Area = 0..3 | Free 0 sangat kecil (Parents), 1 dekat owner (Saso), 2 sedang (Sanshouuo),
--                       3 luas (Karasu/Akamaru), Free tidak memakai batas owner.
--                       Batas target berlaku untuk semua AI; ikut-owner hanya untuk AI generik LuaSummon.
--    Stride             (tanpa nilai; boleh juga Stride = true) AI generik LuaSummon: saat tidak ada musuh, clone
--                       terus maju ke depan seperti Akamaru tanpa menunggu pemilik bergerak, lalu kembali jika lebih
--                       jauh dari (radius Area - 64) dari pemilik. Dengan Area = Free clone terus maju tanpa kembali ke pemilik.
--                       Tidak berlaku untuk AI Karasu/Akamaru/Parents (hanya AI generik LuaSummon).
--    target = a, b      hanya jenis ini yang dipilih. Jenis: shinobi, guardian, flog, tower, clone,
--    untarget = a, b    kugutsu, summon, mon. Daftar boleh dipisah koma, +, |, atau ;
--    Attack = skill02+skill03   clone memakai skill ini otomatis saat cooldown siap dan musuh dalam jarak.
--    setMonAttack = n = skill01 command <e type="setMonAttack">n</e> milik pemilik menjalankan skill01 clone.
--                       Boleh beberapa baris/kunci: setMonAttack = 2 = skill02+skill03
--    lock = skill01     skill01 PEMILIK terkunci selama clone hidup.
--    unlock = skill02+skill03   skill02/03 pemilik terkunci sebelum clone ada, terbuka saat clone hidup,
--                       terkunci lagi saat clone mati.
--    Skills = Lock      mengunci semua skill pemilik saat clone hidup (unlock tetap membuka yang disebut).
--  Catatan: clone hanya punya skill01..skill03, jadi Attack / setMonAttack di atas skill03 dilewati
--  (ada pesan di log). Kunci pemilik berlaku untuk skill01..skill05.
-- ============================================================

-- ============================================================
--  BUFF DENGAN ID BEBAS  (#Buff)
-- ============================================================
--  Pemilik = { id = N, kunci = nilai, ... }   dipakai saat XML menjalankan <e type="setBuff">N</e>.
--  Pemilik tanpa definisi untuk id itu tetap memakai setBuff bawaan (Kiba, Naruto, dst).
--  Durasi buff = attackRangeY pada data skill yang memanggil setBuff (sama seperti buff bawaan).
--  skillNN = aksi ke-NN di XML karakter (urutan file; skill10 = <action name="skill10">).
--  Kunci:
--    id = N                       nilai setBuff di XML (bebas, mis. 11, 17, 30)
--    idle / walk / nAttack / dead / hurt = skillNN
--                                 selama buff aktif animasi diganti dengan aksi skillNN
--    skill01..skill05 = skillNN   skill diganti skill baru (skill1 = skill10 -> skill1_1): animasi, jenis,
--                                 damage, jarak, dan cooldown diambil dari aksi skillNN
--    Armored                      tidak terkena crowd control
--    Imun                         tidak terkena damage
--    Hide = skill04+skill05       tombol skill disembunyikan dan dikunci selama buff aktif
--    lock = skill02+skill03       terkunci tanpa buff, terbuka selama buff aktif, terkunci lagi saat buff mati (seperti Kiba)
--    Skills = Lock                semua skill terkunci selama buff aktif (lock = ... tetap membuka yang disebut)
--    closing = timer              buff mati saat durasi habis (bawaan)
--    closing = setActionResume    buff mati saat setActionResume di XML dijalankan
--    closing = setActionResume + timer      mati saat salah satunya terjadi
--    closing = ... timer > skill09          saat TIMER habis, jalankan aksi skill09 (tidak dijalankan saat resume)
--    closing = clone              buff mati saat semua clone/kuchiyose/kugutsu milik pemilik sudah mati (seperti Kiba);
--                                 berlaku untuk semua jenis summon, termasuk AI generik LuaSummon (logika AI baru)
--    closing = clone + timer      mati saat clone habis ATAU durasi habis (juga: clone + setActionResume)
--  Buff dipasang ulang saat masih aktif -> dipulihkan lalu dimulai dari awal. Buff berakhir saat karakter mati.
-- ============================================================

-- ============================================================
--  TANGKAP / CATCH  (#Catch)
-- ============================================================
--  Nama = Donor   reaksi tangkap saat serangan ber-ct_hit (<e type="setAttackBox">ct_hit</e>)
--                 mengikuti perilaku Donor, bukan nama penyerang itu sendiri.
--    Rashomon = SandBall   Rashomon (AI Rocket lewat #Monster) menangkap seperti SandBall
--    Ashura = Lee          Ashura (AI Kisame lewat #Characters) menangkap seperti Lee
--  Yang dipinjam: lama tangkap, jenis hardHurt, posisi korban, efek (Shenwei, Kuroari, Sabaku, SandBall, KageHand,
--  QuanRen, KageBom, Tsukuyomi/Itachi, Parents/Chiyo, NarakaPath/Nagato, Lee, Kakuzu, Tobi, dst).
--  Nama bisa nama data atau nama alias (#Monster). Hit ct_hit sendiri tetap harus ada di XML penyerang.
--  Donor jenis mon yang bergantung pada master (KageHand, Tsukuyomi, Parents, dst) butuh penyerang yang punya master.
-- ============================================================
